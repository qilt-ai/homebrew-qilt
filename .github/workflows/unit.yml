name: Synthetic controls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOMEBREW_QILT_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8
        with:
          ruby-version: "3.4"
      - name: Record runtime and run synthetic controls
        run: |
          ruby --version
          ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
          ruby -c lib/qilt_private_download_strategy.rb
